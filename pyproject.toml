[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial-route-planner"
version = "1.0.0"
description = "Weighted graph routing with blocked links and deterministic shortest paths"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
geospatial-route-planner = "geospatial_route_planner:entrypoint"

[tool.setuptools.packages.find]
include = ["geospatial_route_planner*"]
